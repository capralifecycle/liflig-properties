name: ci
on:
  push:
    branches:
      - "**"

defaults:
  run:
    # NOTE: A bit stricter than the default bash options used by GitHub Actions
    # (bash --noprofile --norc -e -o pipefail {0})
    shell: bash --noprofile --norc -euo pipefail {0}

# NOTE: Set concurrency for the current workflow to 1
concurrency: ci-${{ github.ref }}-${{ github.workflow }}

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "zulu"
          java-version: "17.0.16"
          java-package: "jdk"

      - name: Distrust compromised eMudhra CAs
        run: |
          f="$JAVA_HOME/lib/security/blocked.certs"
          test -f "$f"
          printf '%s\n' '' '# eMudhra compromised intermediate CAs (2026-10-20)' \
            '42C4ACCD12C4F59597925E1A08A7A90102608543809308D50EC427E118BA1493' \
            '45A883F349AEDFD5F3A649B5498FFB121712BA8B448F3F2A91DBC5A766FCDDBE' \
            '98B896625C0C230ADEEC3EB2CF6AAD5001ECF9156A68644E82374CE5833BC25B' \
            '5F1DED4DD590AF74631290CF073B122A2AAC6A1FA479778A0BD43579BD832699' \
            'E7568FE6E12331F4FD7DE61DA4C7559D0F8EB192A218D4741A3BA75184333838' \
            '579480AEA166290BD3C643589E795FC0D0E54E86505D180F1DFF99EFD3199512' \
            '0164D7CEAE5BB909C272AF151FF44B1177AE9B47D9424B94F1D9558C30934D19' \
            '62B7F9868263F72F6911FC78CEAF72C1979158B7368BF648683BB2AA39B02E72' \
            'CB6E15165AC802E9B3F993F16C25D41F4E81C21EBDE71AE1B012AC00BF9C7C3F' \
            '7485B51C0ED192878FA1D2F948FB529AE1842CC5086C4B67F7BE5B2039DE9489' \
            '432EC25F0D28DE9006D97BF752F17BBB2CD41F669933FCB072D9A1148D0261F3' \
            'FD9D5C2DBBD4995AB69B8D50C439D9527B00529199C2FD01B2174EB58F07021F' \
            '9E39DE2881273ACC225A149C72BA3E0F51424963669AB633EE1DC7DF5DB067B4' \
            'A496E23AC0CAB8155FC9B117B97EAE368EFCBB9041AEC8804D5A308D2D01C2D8' \
            '4B2460A466F95FD40113BCDCCA2CEB29B3B093921DE45474DA7DF48874C630B1' \
            '84112972B8E59D14560AE7E7119654474AAD119990CF3722BFC1E3B91615E1FD' \
            >> "$f"
          roots='^Owner: CN=(emSign ECC Root CA - G3|AAA Certificate Services),'
          "$JAVA_HOME/bin/keytool" -list -v -cacerts -storepass changeit \
            | awk -v r="$roots" '/^Alias name: /{a=substr($0, 13)} $0 ~ r {print a}' \
            | while IFS= read -r alias; do
                "$JAVA_HOME/bin/keytool" -delete -cacerts -storepass changeit -alias "$alias"
              done
          if "$JAVA_HOME/bin/keytool" -list -v -cacerts -storepass changeit | grep -E "$roots"; then
            echo "eMudhra roots still trusted" >&2
            exit 1
          fi

      - name: cache mvn
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: release preparation
        id: prep
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          major_version="$(sed -n "s/^.*<major-version>\([0-9]\{1,\}\)<\/major-version>.*$/\1/p" pom.xml)"
          echo "$major_version" | grep -q "^[0-9]\{1,\}$" || {
            echo "ERROR: Failed to extract <major-version> from pom.xml"
            exit 1
          }
          echo "major-version=$major_version" >> "$GITHUB_OUTPUT"

      - uses: capralifecycle/actions-lib/generate-tag@c3fd36456df3f98ebd08396164a1a995f850c118 # v1.21.1
        id: tag
        with:
          tag-prefix: "${{ steps.prep.outputs.major-version }}"
          tag-type: "punctuated-timestamp-tag"

      - name: resolve dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B dependency:resolve

      - name: conditional release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONDITIONAL_RELEASE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          TAG: "${{ steps.tag.outputs.tag }}"

        run: |
          if [ "$CONDITIONAL_RELEASE" = "true" ]; then
            echo "Releasing library with tag '$TAG'"
            mvn -B source:jar deploy scm:tag -Drevision="$TAG" -Dtag="$TAG" \
              org.apache.maven.plugins:maven-enforcer-plugin:3.0.0-M3:enforce -Drules=requireReleaseDeps
          else
            mvn -B -U verify
          fi
